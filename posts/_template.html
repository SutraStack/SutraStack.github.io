<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POST TITLE — Ayush</title>
<meta name="description" content="One sentence describing this post. Shows up in Google and link previews.">
<link rel="stylesheet" href="../assets/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='28' fill='%2356a8ff'/></svg>">
<style>
  /* post-specific styling */
  .prose pre{background:var(--bg-3);border:1px solid var(--line);border-radius:12px;
    padding:14px 16px;overflow-x:auto;font-family:var(--mono);font-size:13px;line-height:1.6}
  .prose blockquote{border-left:3px solid var(--acc);margin:18px 0;padding:4px 0 4px 16px;
    color:var(--tx-2);font-style:italic}
  .prose img{max-width:100%;border-radius:10px;border:1px solid var(--line)}
</style>
</head>
<body>

<div id="top"><div class="inner">
  <a class="brand" href="/"><span class="dot"></span>Ayush</a>
  <nav>
    <a href="/">Posts</a>
    <a href="/library.html">Library</a>
    <a href="/about.html">About</a>
    <button class="tbtn" id="themebtn" title="Toggle theme" aria-label="Toggle theme">◐</button>
  </nav>
</div></div>

<div class="wrap prose">
  <header class="hero">
    <div class="meta" style="display:flex;gap:10px;margin-bottom:12px">
      <time datetime="2026-11-01">1 Nov 2026</time>
      <span class="tag">topic</span>
    </div>
    <h1>POST TITLE</h1>
    <p>A one-paragraph standfirst: what this post covers and who it's for.</p>
  </header>

  <h2>First section</h2>
  <p>Write here.</p>

  <footer>
    <p><a href="/">← All posts</a></p>
  </footer>
</div>

<script>
(function(){
  var root = document.documentElement;
  try {
    var saved = localStorage.getItem("blog-theme");
    if (saved) root.dataset.theme = saved;
    else if (matchMedia("(prefers-color-scheme: light)").matches) root.dataset.theme = "light";
  } catch(e){}
  document.getElementById("themebtn").onclick = function(){
    root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
    try { localStorage.setItem("blog-theme", root.dataset.theme); } catch(e){}
  };
})();
</script>
</body>
</html>
